# Continuous integration: the daemon test suite (it also checks that every language catalog has the same keys).
name: test
on:
  push:
  pull_request:
jobs:
  daemon:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd daemon && npm test
