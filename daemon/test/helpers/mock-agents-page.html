<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cursor Agents (mock di prova)</title>
<!--
  FAKE page mimicking the Agents Window structure read from Cursor's bundle (not Cursor itself):
  sidebar rows `data-sidebar-item-key="row:<id>"`, questionnaire tray (`glass-questionnaire-tray`, options
  `ui-tray-option`, freeform `questionnaire-freeform-option`, primary/secondary footer) and Lexical-like composer.
  Selection logic mirrors bundle functions: Weg (single: second click deselects), Jnl (advance or submit),
  ie (single choice auto-advances). Used only to exercise agents-ui.js in real Chromium.
-->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.3 system-ui, sans-serif; display: grid; grid-template-columns: 220px 1fr; height: 100vh; overflow: hidden; }
  #sidebar { border-right: 1px solid #ccc; padding: 6px; }
  .row { display: block; width: 100%; padding: 8px; margin: 2px 0; border: 1px solid #ddd; background: #fff; text-align: left; cursor: pointer; }
  .row[aria-selected="true"] { background: #dde7ff; }
  #main { position: relative; }
  #menu-root { position: absolute; left: 0; top: 0; }
  .glass-questionnaire-tray { position: absolute; left: 10px; right: 10px; top: 10px; border: 1px solid #888; padding: 8px; background: #fafafa; max-height: 320px; overflow: auto; }
  .glass-questionnaire-tray[hidden] { display: none; }
  .ui-tray-option { display: flex; gap: 8px; align-items: center; width: 100%; padding: 6px; margin: 3px 0; border: 1px solid #bbb; background: #fff; text-align: left; }
  .ui-tray-option[aria-pressed="true"] { background: #cfe3ff; }
  .editor { flex: 1; min-height: 20px; border: 1px solid #99a; padding: 2px 4px; }
  .editor[hidden] { display: none; }
  .ui-tray-footer { display: flex; gap: 8px; margin-top: 8px; }
  .composer { position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; gap: 8px; align-items: flex-end; border: 1px solid #888; padding: 6px; background: #fff; }
  .ui-prompt-input-editor__input, .decoy-input { flex: 1; min-height: 40px; max-height: 120px; overflow: auto; outline: none; }
  button[disabled] { opacity: .5; }
  #sidebar-box.hidden { display: none; }
</style>
</head>
<body>
<button type="button" id="sbtoggle" aria-label="Hide Sidebar" style="position:absolute;right:4px;top:4px;z-index:5">Barra</button>
<div id="sidebar-box">
  <div id="newchat-bar" hidden><button class="ui-select-trigger" type="button"></button><button class="ui-select-trigger" type="button">main</button><button class="ui-select-trigger" type="button"></button></div>
  <button type="button" aria-label="Customize Sidebar" id="customize">Filtri</button>
  <nav id="pinned"></nav>
  <div id="heads"></div>
  <nav id="sidebar"></nav>
</div>
<div id="menu-root"></div>
<main id="main" data-agent-panel-conversation-shell data-glass-agent-id="live">
  <div class="glass-questionnaire-tray" id="tray" hidden></div>
  <div id="approvals" style="position:absolute;left:10px;right:10px;top:340px"></div>
  <div class="composer">
    <div id="previews"></div>
    <input type="file" id="files" multiple accept="image/*,.pdf" hidden>
    <div class="tiptap ProseMirror ui-prompt-input-editor__input" contenteditable="true" role="textbox" id="composer"></div>
    <button type="button" aria-label="Add context" id="addctx">+</button>
    <button type="button" id="modelbtn">Claude Sonnet 5.5 High</button>
    <button type="button" aria-label="Send message" id="send" disabled>Invia</button>
    <button type="button" aria-label="Stop generation" id="stop" hidden>Stop</button>
  </div>
</main>
<!-- As in Cursor 3.24: other chat panels stay alive but hidden, each with its own composer (bottommost wins). -->
<div data-keep-alive-hidden="">
  <div data-agent-panel-conversation-shell data-glass-agent-id="decoy" style="position:absolute;left:0;right:0;bottom:0;height:30px">
    <div class="tiptap ProseMirror ui-prompt-input-editor__input decoy-input" contenteditable="true" id="decoy-composer"></div>
    <button type="button" aria-label="Send message" id="decoy-send">Invia</button>
    <button type="button" aria-label="Stop generation" id="decoy-stop">Stop</button>
  </div>
</div>
<script>
(() => {
  const FREE = '__freeform_other__';
  const LETTERS = 'ABCDEFGHIJKL';
  // --- Cursor bundle logic (original names in parentheses) ---
  const allAnswered = (qs, sel) => qs.every((q) => (sel[q.id]?.length ?? 0) > 0); // Qnl
  const nextUnanswered = (qs, qid, sel) => { // eil
    const i = qs.findIndex((q) => q.id === qid);
    let r = qs.findIndex((q, o) => (o <= i ? false : (sel[q.id]?.length ?? 0) === 0));
    if (r < 0) r = qs.findIndex((q, o) => (o >= i ? false : (sel[q.id]?.length ?? 0) === 0));
    return r;
  };
  const decide = (qs, qid, sel) => { // Jnl
    if (allAnswered(qs, sel)) return { type: 'submit' };
    if (qid === undefined) return { type: 'none' };
    const i = nextUnanswered(qs, qid, sel);
    return i >= 0 ? { type: 'advance', next: i } : { type: 'none' };
  };
  const toggle = (cur, id, multi) => { // Weg
    const has = cur.includes(id);
    return multi ? (has ? cur.filter((x) => x !== id) : [...cur, id]) : (has ? [] : [id]);
  };

  const isOther = (l) => { // Ylk
    const s = String(l).toLowerCase().trim();
    return s === 'other' || s.startsWith('other:') || s.startsWith('other -') || s.startsWith('other (');
  };

  let S = null;
  const $ = (s) => document.querySelector(s);

  function sidebar() {
    const nav = $('#sidebar');
    nav.replaceChildren();
    const pinnedNav = $('#pinned');
    pinnedNav.replaceChildren();
    const heads = $('#heads');
    heads.replaceChildren();
    for (const name of S.projects) {
      const head = document.createElement('div');
      head.setAttribute('data-section-head', '');
      head.append(document.createTextNode(name));
      const b = document.createElement('button');
      b.type = 'button'; b.setAttribute('aria-label', 'New Agent'); b.style.cssText = 'width:16px;height:16px;margin-left:6px';
      b.addEventListener('click', () => { S.newChat = { project: name }; S.current = null; S.log.push(`newagent:${name}`); render(); });
      head.append(b);
      heads.append(head);
    }
    $('#modelbtn').textContent = S.model;
    const bar = $('#newchat-bar');
    bar.hidden = !S.newChat;
    if (S.newChat) {
      const t = bar.querySelectorAll('.ui-select-trigger');
      t[0].textContent = S.newChat.project.toLowerCase();
      t[1].textContent = S.branch;
      t[2].textContent = S.env ?? 'This Mac';
    }
    for (const id of Object.keys(S.chats)) {
      if (S.chats[id].archived && !S.showArchived) continue;
      const b = document.createElement('button');
      b.className = 'row';
      b.setAttribute('data-sidebar-item-key', `row:${id}`);
      b.setAttribute('aria-selected', String(S.current === id));
      if (S.renaming === id) {
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'ui-text-editable';
        input.value = S.chats[id].name || id;
        input.addEventListener('click', (ev) => ev.stopPropagation());
        input.addEventListener('keydown', (ev) => {
          if (ev.key === 'Enter') { S.chats[id].name = input.value; S.renamed.push({ id, name: input.value }); S.renaming = null; sidebar(); }
          else if (ev.key === 'Escape') { S.renaming = null; sidebar(); }
        });
        b.append(input);
        setTimeout(() => { input.focus(); input.select(); }, 0);
      } else {
        b.textContent = S.chats[id].name || id;
        b.addEventListener('click', () => { if (S.stuckOpen) { S.log.push(`stuck:${id}`); return; } S.current = id; S.log.push(`open:${id}`); render(); });
      }
      b.addEventListener('contextmenu', (ev) => {
        ev.preventDefault();
        if (S.swallowMenus > 0) { S.swallowMenus--; S.log.push(`menu_swallowed:${id}`); return; } // a re-rendering row eats the click
        const archived = S.chats[id].archived === true;
        menu([
          { label: S.chats[id].pinned ? 'Unpin' : 'Pin', run: () => { S.chats[id].pinned = !S.chats[id].pinned; S.pins.push({ id, pinned: S.chats[id].pinned }); sidebar(); } },
          { label: 'Rename', run: () => { S.renaming = id; sidebar(); } },
          { label: archived ? 'Unarchive' : 'Archive', run: () => { S.chats[id].archived = !archived; (archived ? S.unarchived : S.archived).push(id); sidebar(); } },
        ]);
      });
      (S.chats[id].pinned ? pinnedNav : nav).append(b);
    }
  }

  // Menu (role=menu / menuitem) like Cursor's: closes on Esc; "checkbox" items keep it open.
  function menu(items) {
    const root = $('#menu-root');
    root.replaceChildren();
    const m = document.createElement('div');
    m.setAttribute('role', 'menu');
    m.style.cssText = 'position:absolute;left:230px;top:40px;border:1px solid #888;background:#fff;z-index:9';
    for (const it of items) {
      const el = document.createElement('div');
      el.setAttribute('role', it.checkbox ? 'menuitemcheckbox' : 'menuitem');
      if (it.checkbox) el.setAttribute('aria-checked', String(it.checked));
      el.style.padding = '6px 10px';
      el.textContent = it.label;
      el.addEventListener('click', () => { it.run(); if (!it.checkbox) root.replaceChildren(); else menu(items.map((x) => (x === it ? { ...x, checked: !x.checked } : x))); });
      m.append(el);
    }
    root.append(m);
  }
  document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') $('#menu-root').replaceChildren(); });
  function branchMenu() {
    const root = $('#menu-root');
    root.replaceChildren();
    const lb = document.createElement('div');
    lb.setAttribute('role', 'listbox');
    lb.style.cssText = 'position:absolute;left:230px;top:40px;border:1px solid #888;background:#fff;z-index:9';
    for (const name of S.branches) {
      const row = document.createElement('div');
      row.setAttribute('role', 'option');
      row.setAttribute('data-component', 'search-menu-row');
      row.setAttribute('aria-selected', String(name === S.branch));
      row.style.padding = '6px 10px';
      const span = document.createElement('span');
      span.setAttribute('data-branch-name', name);
      span.textContent = name;
      row.append(span);
      row.addEventListener('click', () => { S.branch = name; S.picks.push({ branch: name }); root.replaceChildren(); sidebar(); });
      lb.append(row);
    }
    root.append(lb);
  }
  function modelMenu() {
    const root = $('#menu-root');
    root.replaceChildren();
    const m = document.createElement('div');
    m.setAttribute('role', 'menu');
    m.style.cssText = 'position:absolute;left:230px;top:40px;border:1px solid #888;background:#fff;z-index:9';
    for (const label of ['Context 300K', 'Effort High', `Model ${S.model}`]) {
      const el = document.createElement('div');
      el.setAttribute('role', 'menuitem');
      el.style.padding = '6px 10px';
      el.textContent = label;
      if (label.startsWith('Model')) el.addEventListener('mouseover', () => {
        if (root.querySelector('[data-sub]')) return;
        const sub = document.createElement('div');
        sub.setAttribute('role', 'menu');
        sub.setAttribute('data-sub', '');
        sub.style.cssText = 'position:absolute;left:450px;top:40px;border:1px solid #888;background:#fff;z-index:9';
        const entries = [{ t: 'Auto' }, { t: 'MAX Mode', box: true }, ...S.models.filter((x) => x !== 'Auto').map((t) => ({ t })), { t: 'Add Models' }];
        for (const e of entries) {
          const it = document.createElement('div');
          it.setAttribute('role', e.box ? 'menuitemcheckbox' : 'menuitem');
          if (e.box) it.setAttribute('aria-checked', 'false');
          it.style.padding = '6px 10px';
          it.textContent = e.t;
          if (!e.box && e.t !== 'Add Models') it.addEventListener('click', () => { S.model = e.t; S.picks.push({ model: e.t }); root.replaceChildren(); sidebar(); });
          sub.append(it);
        }
        root.append(sub);
      });
      m.append(el);
    }
    root.append(m);
  }
  $('#modelbtn').addEventListener('click', () => modelMenu());
  document.querySelectorAll('.ui-select-trigger')[1].addEventListener('click', () => branchMenu());
  $('#customize').addEventListener('click', () => {
    menu([{ label: 'Archived', checkbox: true, checked: S.showArchived, run: () => { S.showArchived = !S.showArchived; sidebar(); } }]);
  });

  const qs = () => S.chats[S.current]?.questions ?? null;
  const qst = () => S.qstate[S.current];
  const trayOpen = () => !!qs() && !S.done[S.current];

  function tray() {
    const el = $('#tray');
    if (!trayOpen()) { el.hidden = true; el.replaceChildren(); return; }
    el.hidden = false;
    const questions = qs();
    const st = qst();
    const q = questions[st.step];
    const sel = st.selections[q.id] ?? [];
    el.replaceChildren();
    const title = document.createElement('div');
    title.className = 'ui-tray-step-title';
    title.textContent = q.prompt;
    el.append(title);
    q.options.filter((o) => !isOther(o.label)).forEach((o, i) => { // uis/Ylk: "Other" options are not shown
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'ui-tray-option';
      b.setAttribute('aria-pressed', String(sel.includes(o.id)));
      b.innerHTML = `<span class="ui-tray-option__badge">${LETTERS[i]}</span><span class="ui-tray-option__label"></span>`;
      b.querySelector('.ui-tray-option__label').textContent = o.label;
      b.addEventListener('click', () => selectOption(q, o.id));
      el.append(b);
    });
    const ff = document.createElement('div');
    ff.className = 'ui-tray-option questionnaire-freeform-option';
    ff.setAttribute('role', 'button');
    ff.setAttribute('aria-pressed', String(sel.includes(FREE)));
    ff.innerHTML = '<span class="ui-tray-option__badge">+</span><span class="ui-tray-option__label">Other...</span>';
    const ed = document.createElement('div');
    ed.className = 'editor';
    ed.setAttribute('contenteditable', 'true');
    ed.hidden = !sel.includes(FREE);
    ed.textContent = st.freeform[q.id] ?? '';
    ed.addEventListener('click', (ev) => ev.stopPropagation());
    ed.addEventListener('input', () => {
      st.freeform[q.id] = ed.innerText.replace(/\n+$/, '');
      if (!(st.selections[q.id] ?? []).includes(FREE)) st.selections[q.id] = [...(st.selections[q.id] ?? []), FREE];
      footer();
    });
    ff.append(ed);
    ff.addEventListener('click', () => selectOption(q, FREE));
    el.append(ff);
    const foot = document.createElement('div');
    foot.className = 'ui-tray-footer';
    foot.innerHTML = '<div class="ui-tray-footer__primary"><button type="button"></button></div><div class="ui-tray-footer__secondary"><button type="button">Skip</button></div>';
    foot.querySelector('.ui-tray-footer__primary button').addEventListener('click', primary);
    foot.querySelector('.ui-tray-footer__secondary button').addEventListener('click', () => { S.skipped.push(S.current); S.done[S.current] = true; S.log.push('skip'); render(); });
    el.append(foot);
    footer();
  }

  function footer() {
    if (!trayOpen()) return;
    const questions = qs();
    const st = qst();
    const d = decide(questions, questions[st.step].id, st.selections);
    const b = $('#tray .ui-tray-footer__primary button');
    b.textContent = d.type === 'advance' ? 'Next' : 'Continue';
    b.disabled = d.type === 'none';
  }

  function selectOption(q, optId) { // ie
    const st = qst();
    const questions = qs();
    S.clicks += 1;
    S.log.push(`pick:${q.id}:${optId}`);
    const cur = st.selections[q.id] ?? [];
    const already = cur.includes(optId);
    st.selections[q.id] = toggle(cur, optId, q.allowMultiple === true);
    if (!q.allowMultiple && !already && optId !== FREE) {
      const d = decide(questions, q.id, st.selections);
      if (d.type === 'advance') st.step = d.next;
    }
    tray();
  }

  function primary() { // ce -> ee
    const questions = qs();
    const st = qst();
    const d = decide(questions, questions[st.step].id, st.selections);
    S.log.push(`primary:${d.type}`);
    if (d.type === 'submit') {
      S.submitted.push({ chat: S.current, selections: JSON.parse(JSON.stringify(st.selections)), freeform: { ...st.freeform } });
      S.done[S.current] = true;
      render();
    } else if (d.type === 'advance') {
      st.step = d.next;
      tray();
    }
  }

  // --- composer: Enter sends, Shift+Enter newline ---
  const comp = $('#composer');
  const send = $('#send');
  const previews = $('#previews');
  const refreshSend = () => { send.disabled = S.sendDisabled === true || (comp.innerText.trim() === '' && previews.children.length === 0); };
  comp.addEventListener('input', refreshSend);
  // Attachments: like Cursor, each image has a `.ui-prompt-input-image-preview` preview with "Remove image".
  $('#files').addEventListener('change', (ev) => {
    if (S.noPreview) return;
    for (const f of ev.target.files) {
      const box = document.createElement('div');
      box.className = 'ui-prompt-input-image-preview';
      box.style.cssText = 'display:inline-flex;gap:4px';
      const img = document.createElement('img');
      img.alt = f.name; img.width = 24; img.height = 24;
      img.src = 'data:image/gif;base64,R0lGODlhAQABAAAAACw=';
      const rm = document.createElement('button');
      rm.type = 'button'; rm.setAttribute('aria-label', 'Remove image'); rm.textContent = 'x';
      rm.style.cssText = 'width:18px;height:18px';
      rm.addEventListener('click', () => { box.remove(); refreshSend(); });
      box.append(img, rm);
      previews.append(box);
    }
    ev.target.value = '';
    refreshSend();
  });
  function doSend() {
    const text = comp.innerText.replace(/\n+$/, '');
    const images = previews.children.length;
    if (!text.trim() && !images) return;
    if (S.newChat) {
      const id = `new-${S.newChats.length + 1}`;
      S.chats[id] = { name: text.slice(0, 20) || 'Chat nuova' };
      S.newChats.push({ id, project: S.newChat.project, text, images });
      S.choices.push({ branch: S.branch, model: S.model });
      S.newChat = null;
      S.current = id;
      // Like Cursor: briefly a "draft" row (other id) appears then disappears.
      S.chats['draft-' + id] = { name: 'Bozza' };
      setTimeout(() => { delete S.chats['draft-' + id]; sidebar(); }, 500);
      comp.replaceChildren();
      previews.replaceChildren();
      refreshSend();
      render();
      return;
    }
    S.sent.push(images ? { chat: S.current, text, images } : { chat: S.current, text });
    comp.replaceChildren();
    previews.replaceChildren();
    refreshSend();
  }
  comp.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); doSend(); }
  });
  send.addEventListener('click', doSend);

  // Terminal command cards awaiting approval: row with `data-message-id`, `.ui-shell-tool-call` card, buttons
  // "Skip" and "Run" (with Enter symbol). After decision buttons disappear, as in Cursor.
  function approvals() {
    const box = $('#approvals');
    box.replaceChildren();
    for (const ap of S.chats[S.current]?.approvals ?? []) {
      const row = document.createElement('div');
      row.setAttribute('data-message-id', ap.messageId);
      const card = document.createElement('div');
      card.className = 'ui-shell-tool-call';
      card.style.cssText = 'border:1px solid #888;padding:6px;margin:4px 0';
      card.append(Object.assign(document.createElement('code'), { textContent: ap.command }));
      if (!S.decided[ap.messageId]) {
        for (const [label, kind] of ap.order ?? [['Skip', 'reject'], ['Run \u23ce', 'approve']]) {
          const b = document.createElement('button');
          b.type = 'button';
          b.textContent = label;
          b.addEventListener('click', () => { S.decided[ap.messageId] = kind; S.log.push(`${kind}:${ap.messageId}`); approvals(); });
          card.append(b);
        }
      }
      row.append(card);
      box.append(row);
    }
  }

  // While chat is "working" shows "Stop generation"; click stops it.
  const stopBtn = $('#stop');
  function running() { stopBtn.hidden = !(S.chats[S.current]?.running && !S.stopped.includes(S.current)); }
  stopBtn.addEventListener('click', () => { S.stopped.push(S.current); S.log.push(`stop:${S.current}`); running(); });

  // Cursor's panel for the open chat carries the composerId; the sidebar can be hidden (rows stay in the DOM, without size).
  function render() {
    $('#main').setAttribute('data-glass-agent-id', S.current || 'live');
    sidebar(); tray(); approvals(); running();
  }
  function sidebarToggle() {
    $('#sidebar-box').classList.toggle('hidden', S.sidebarHidden);
    $('#sbtoggle').setAttribute('aria-label', S.sidebarHidden ? 'Show Sidebar' : 'Hide Sidebar');
  }
  $('#sbtoggle').addEventListener('click', () => { S.sidebarHidden = !S.sidebarHidden; S.log.push(S.sidebarHidden ? 'sidebar:hide' : 'sidebar:show'); sidebarToggle(); });

  window.__mock = {
    reset(cfg) {
      document.querySelector('#previews').replaceChildren();
      S = { current: cfg.current ?? null, chats: cfg.chats, qstate: {}, done: {}, submitted: [], skipped: [], sent: [], clicks: 0, log: [], decided: {}, stopped: [], renamed: [], archived: [], unarchived: [], pins: [], showArchived: false, renaming: null, noPreview: cfg.noPreview === true, sendDisabled: cfg.sendDisabled === true, sidebarHidden: cfg.sidebarHidden === true, stuckOpen: cfg.stuckOpen === true, swallowMenus: cfg.swallowMenus ?? 0, projects: cfg.projects ?? [], env: cfg.env ?? null, newChat: null, newChats: [], branches: cfg.branches ?? ['main'], branch: cfg.branch ?? (cfg.branches ?? ['main'])[0], model: cfg.model ?? 'Claude Sonnet 5.5 High', models: cfg.models ?? ['Auto', 'Composer 2.5', 'Claude Sonnet 5.5 High', 'Claude Opus 4.6 High'], picks: [], choices: [] };
      for (const [id, c] of Object.entries(S.chats)) {
        S.qstate[id] = { step: 0, selections: JSON.parse(JSON.stringify(cfg.initialSelections?.[id] ?? {})), freeform: { ...(cfg.initialFreeform?.[id] ?? {}) } };
        if (c.questions) {
          const first = c.questions.findIndex((q) => (S.qstate[id].selections[q.id]?.length ?? 0) === 0);
          S.qstate[id].step = first >= 0 ? first : 0; // qeg
        }
      }
      comp.replaceChildren();
      if (cfg.draft) comp.textContent = cfg.draft;
      refreshSend();
      render();
      sidebarToggle();
    },
    state() { return JSON.stringify({ current: S.current, submitted: S.submitted, skipped: S.skipped, sent: S.sent, clicks: S.clicks, log: S.log, decided: S.decided, stopped: S.stopped, renamed: S.renamed, archived: S.archived, unarchived: S.unarchived, pins: S.pins, showArchived: S.showArchived, renaming: S.renaming, newChats: S.newChats, newChat: S.newChat, picks: S.picks, choices: S.choices, branch: S.branch, model: S.model, sidebarHidden: S.sidebarHidden, draft: comp.innerText }); },
  };
})();
</script>
</body>
</html>
